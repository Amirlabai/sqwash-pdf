services:
  - type: web
    name: sqwash-pdf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
