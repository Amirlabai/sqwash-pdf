services:
  - type: web
    name: sqwash-pdf-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: VERCEL_APP_URL
        value: https://sqwash-pdf.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
